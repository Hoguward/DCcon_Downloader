<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCcon Downloader</title>
<meta name="description" content="디시인사이드 디시콘을 브라우저에서 바로 찾아보고 저장하는 웹 버전.">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --border: #dfe1e5;
  --ink: #222222;
  --ink-soft: #5f6b7a;
  --ink-faint: #9aa2b1;
  --accent: #1e5fdb;
  --accent-soft: #e8f0fe;
  --good: #1d9e75;
  --good-soft: #e6f7f1;
  --warn: #ba7517;
  --warn-soft: #fbf0dd;
  --danger: #e24b4a;
  --thumb-bg: #f4f6f8;
  --modal-well: #e4e7ec;
  --radius: 10px;
  --sans: "맑은 고딕", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* --thumb-bg 는 다크모드에서도 일부러 바꾸지 않는다 — 디시콘은 대부분
   흰/투명 배경에 어두운 선으로 그려져 있어서, 썸네일 배경까지 어둡게
   하면 그림 윤곽이 배경에 묻혀 안 보이게 된다(실사용 중 발견). */
:root[data-theme="dark"] {
  --bg: #14181f;
  --surface: #1c222c;
  --border: #454f66;
  --ink: #e8e6df;
  --ink-soft: #aab0bd;
  --ink-faint: #949cad;
  --accent: #6ba8f5;
  --accent-soft: #1e2c40;
  --good: #4fd3a3;
  --good-soft: #16302a;
  --warn: #e0a94a;
  --warn-soft: #382b12;
  --danger: #e8837e;
  --modal-well: #0c0f14;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f;
    --surface: #1c222c;
    --border: #454f66;
    --ink: #e8e6df;
    --ink-soft: #aab0bd;
    --ink-faint: #949cad;
    --accent: #6ba8f5;
    --accent-soft: #1e2c40;
    --good: #4fd3a3;
    --good-soft: #16302a;
    --warn: #e0a94a;
    --warn-soft: #382b12;
    --danger: #e8837e;
    --modal-well: #0c0f14;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.5;
}

/* ---------- 상단 바 ---------- */
.topbar {
  background: var(--accent);
  color: #fff;
  padding: 14px 20px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.topbar h1 { font-size: 17px; font-weight: 700; margin: 0; }
.topbar .tagline { font-size: 12.5px; opacity: 0.85; }

.theme-toggle {
  margin-left: auto;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.12);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.theme-toggle:hover { background: rgba(255,255,255,0.22); }
.theme-toggle:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}

.tab {
  font-family: inherit;
  font-size: 13.5px;
  padding: 7px 14px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-soft);
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.tab:hover { background: var(--accent-soft); color: var(--accent); }
.tab[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.search-form { display: flex; gap: 6px; margin-left: auto; }
.search-form input {
  font-family: inherit;
  font-size: 13.5px;
  padding: 7px 12px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink);
  width: 200px;
}
.search-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search-form select {
  font-family: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.search-form select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search-form button {
  font-family: inherit;
  font-size: 13px;
  padding: 7px 16px;
  border-radius: 100px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-weight: 600;
}

.status-row {
  padding: 10px 20px 0;
  font-size: 13px;
  color: var(--ink-faint);
  min-height: 20px;
}

/* ---------- 저장 폴더 바 (데스크톱 전용) ---------- */
.folder-bar {
  margin: 12px 20px 0;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 38px;
  padding: 0 8px 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 12.5px;
}
.folder-bar .folder-icon { flex: none; color: var(--ink-faint); font-size: 14px; line-height: 1; }
.folder-bar .folder-label { flex: none; color: var(--ink-faint); }
.folder-bar .folder-path {
  flex: 1;
  min-width: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.folder-bar button {
  font-family: inherit;
  flex: none;
  border: none;
  cursor: pointer;
  border-radius: 7px;
  padding: 6px 12px;
  font-size: 11.5px;
}
.folder-bar .folder-open {
  background: transparent;
  color: var(--ink-faint);
}
.folder-bar .folder-open:hover { background: var(--bg); color: var(--ink); }
.folder-bar .folder-change {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.folder-bar .folder-change:hover { filter: brightness(0.96); }

/* ---------- 우클릭 컨텍스트 메뉴 (데스크톱 전용) ---------- */
.ctx-menu {
  position: fixed;
  min-width: 178px;
  padding: 4px 0 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: 0 10px 34px rgba(15, 20, 30, 0.28);
  z-index: 200;
  font-size: 12.5px;
}
.ctx-menu[hidden] { display: none; }
.ctx-menu .ctx-target {
  padding: 7px 12px 5px;
  font-size: 10.5px;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}
.ctx-menu .ctx-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 14px 8px 12px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--ink);
}
.ctx-menu .ctx-item:hover { background: var(--accent-soft); color: var(--accent); }
.ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* ---------- 다운로드 완료 토스트 (데스크톱 전용) ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%) translateY(14px);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 12px 11px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  box-shadow: 0 8px 30px rgba(15, 20, 30, 0.24);
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease-out, transform 0.18s ease-out;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast .toast-icon {
  flex: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--good-soft);
  color: var(--good);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}
.toast .toast-text { display: flex; flex-direction: column; gap: 2px; }
.toast .toast-title { font-size: 12.5px; font-weight: 600; }
.toast .toast-path {
  font: 10.5px ui-monospace, Menlo, monospace;
  color: var(--ink-faint);
  max-width: 260px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast button {
  font-family: inherit;
  flex: none;
  border: none;
  cursor: pointer;
  border-radius: 8px;
}
.toast .toast-open {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 7px 13px;
}
.toast .toast-open:hover { filter: brightness(0.96); }
.toast .toast-dismiss {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  background: transparent;
  font-size: 12px;
}
.toast .toast-dismiss:hover { background: var(--bg); }

/* ---------- 카드 그리드 ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
  padding: 16px 20px 40px;
}

.card {
  /* .card는 <button> 태그라 브라우저 기본 스타일이 텍스트 색을
     buttontext(보통 검정)로 강제 지정한다 — body의 color: var(--ink)가
     상속되지 않아 다크모드에서도 카드 안 글자가 항상 검게 보이던 원인.
     명시적으로 지정해 상속을 되살린다. */
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.12s, background 0.12s, transform 0.12s;
}
.card:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.saved { border-color: var(--good); background: var(--good-soft); }
.card.saved:hover { border-color: var(--accent); background: var(--accent-soft); }

.card .thumb-box {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 6px;
  background: var(--thumb-bg);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}
.card img { width: 100%; height: 100%; object-fit: contain; }
.rank-badge {
  position: absolute;
  top: 4px;
  left: 4px;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 100px;
  line-height: 1.4;
}
.card .title {
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .seller {
  font-size: 11px;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .saved-pill {
  display: none;
  margin-top: 4px;
  font-size: 10px;
  font-weight: 700;
  color: var(--good);
  letter-spacing: 0.02em;
}
.card.saved .saved-pill { display: inline-block; }

.empty-state {
  padding: 60px 20px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 14px;
}

/* ---------- 페이지네이션 ---------- */
.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 0 20px 36px;
}
.pager button {
  font-family: inherit;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.pager button:disabled { opacity: 0.4; cursor: default; }
.pager span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- 상세 모달 ---------- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(10, 14, 20, 0.55);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  z-index: 100;
}
.modal-backdrop[hidden] { display: none; }

.modal {
  background: var(--surface);
  border-radius: 14px;
  width: min(720px, 100%);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  background: var(--accent);
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.modal-head h2 { font-size: 16px; margin: 0; flex: 1; }
.modal-head .close-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  flex-shrink: 0;
}
.modal-meta {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--ink-soft);
}
.modal-body {
  /* .modal이 flex column인데 flex 자식의 기본 min-height는 auto라서,
     이모티콘이 많아 콘텐츠가 커지면 이 영역이 .modal의 max-height(88vh)를
     넘어 뚫고 나가버린다 — 그 결과 부모의 overflow:hidden에 아래쪽이
     잘리면서 그리드 셀들이 겹쳐 보이는 것처럼 보였다. flex:1 로 남은
     공간만 차지하게 하고 min-height:0 으로 그 기본값을 깨서, 넘치는 만큼은
     이 영역 안에서만(overflow-y:auto) 스크롤되게 한다. */
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px 24px;
  /* 셀들 사이를 낮은 톤의 패널(--modal-well)로 채운다 — 확대 검증
     결과 셀 자체는 정사각형/테두리 모두 정확히 그려지고 있었지만,
     디시콘 이미지 대부분이 "같은 캐릭터의 연속 장면"이라 셀 사이
     여백만으로는 시각적으로 하나로 이어붙어 보였다(콘텐츠 특성).
     gap을 크게 벌리고 그 틈의 배경색 자체를 셀 배경(밝은 --thumb-bg)
     과 뚜렷이 다른 톤으로 채워야 "각각 분리된 카드"로 인식된다. */
  background: var(--modal-well);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  /* 진짜 원인: grid-auto-rows 기본값(auto)에서는 aspect-ratio로 계산된
     셀 높이가 트랙 사이징에 반영되지 않아, 다음 행이 훨씬 이른 지점
     (실측 25px 뒤, 셀 실제 높이는 117px)에서 시작해 버렸다 — 셀 자체는
     정사각형으로 정확히 그려지는데 행끼리 92px씩 겹쳐 들어가 있었던
     것. auto-fill 그리드는 열 폭을 런타임에 결정하므로 고정 px 대신
     같은 minmax를 auto-rows에도 그대로 적용해 열=행 트랙 크기를
     일치시킨다. */
  grid-auto-rows: minmax(110px, 1fr);
  gap: 20px;
  align-content: start;
}
.modal-body .cell {
  border: 1px solid var(--border);
  border-radius: 8px;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--thumb-bg);
  position: relative;
  box-shadow: 0 2px 6px rgba(0,0,0,0.28);
}
.modal-body .cell img { display: block; width: 100%; height: 100%; object-fit: contain; }
.modal-body .cell a.dl {
  position: absolute; right: 4px; bottom: 4px;
  background: rgba(20,24,31,0.72);
  color: #fff;
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 100px;
  text-decoration: none;
  opacity: 0;
  transition: opacity 0.12s;
}
.modal-body .cell:hover a.dl,
.modal-body .cell:focus-within a.dl { opacity: 1; }

.modal-actions {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
}
.btn-primary {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.btn-primary:disabled { opacity: 0.5; cursor: default; }
.zip-status { font-size: 12px; color: var(--ink-faint); }

.loading-row { padding: 40px; text-align: center; color: var(--ink-faint); font-size: 13px; }

@media (max-width: 520px) {
  .search-form { width: 100%; margin-left: 0; }
  .search-form input { flex: 1; width: auto; }
}
</style>
<script>
// body가 그려지기 전에 저장된 테마를 즉시 적용 — <body> 안에서 하면
// 어두운/밝은 화면이 잠깐 뒤집혀 보이는 깜빡임(FOUC)이 생긴다.
(function () {
  const saved = localStorage.getItem("dccon_theme");
  if (saved === "dark" || saved === "light") {
    document.documentElement.setAttribute("data-theme", saved);
  }
})();
</script>
</head>
<body>
<header class="topbar">
  <h1>DCcon Downloader</h1>
  <span class="tagline">디시콘 일괄 다운로더 · Web</span>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="어두운 화면으로 전환">🌙</button>
</header>

<nav class="toolbar">
  <button class="tab" data-mode="top" data-period="day" aria-pressed="true">일간 인기</button>
  <button class="tab" data-mode="top" data-period="week" aria-pressed="false">주간 인기</button>
  <button class="tab" data-mode="top" data-period="month" aria-pressed="false">월간 인기</button>
  <button class="tab" data-mode="new" aria-pressed="false">NEW</button>
  <button class="tab" id="tab-local" data-mode="local" aria-pressed="false" hidden>내 보관함</button>
  <form class="search-form" id="search-form">
    <select id="search-category" aria-label="검색 카테고리">
      <option value="title" selected>디시콘명</option>
      <option value="nick_name">닉네임</option>
      <option value="tags">태그</option>
    </select>
    <input type="search" id="search-input" placeholder="디시콘 검색" aria-label="디시콘 검색">
    <button type="submit">찾기</button>
  </form>
</nav>

<div class="folder-bar" id="folder-bar" hidden>
  <span class="folder-icon" aria-hidden="true">📁</span>
  <span class="folder-label">저장 폴더</span>
  <span class="folder-path" id="folder-path"></span>
  <button type="button" class="folder-open" id="folder-open-btn">열기</button>
  <button type="button" class="folder-change" id="folder-change-btn">변경</button>
</div>

<p class="status-row" id="status" role="status" aria-live="polite"></p>

<main id="grid" class="grid" aria-live="polite"></main>

<div class="pager" id="pager" hidden>
  <button id="prev-page">◀ 이전</button>
  <span id="page-label">1 / 1</span>
  <button id="next-page">다음 ▶</button>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="close-btn" id="modal-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="modal-download-all">전체 다운로드 (zip)</button>
      <span class="zip-status" id="zip-status"></span>
    </div>
  </div>
</div>

<div class="ctx-menu" id="ctx-menu" hidden>
  <div class="ctx-target" id="ctx-target"></div>
  <div class="ctx-item" id="ctx-download">
    <span aria-hidden="true">⬇</span>다운로드
  </div>
  <div class="ctx-item" id="ctx-copy">
    <span aria-hidden="true">📋</span>클립보드로 복사
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-copy-link">이미지 주소 복사</div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" aria-hidden="true">✓</span>
  <span class="toast-text">
    <span class="toast-title" id="toast-title"></span>
    <span class="toast-path" id="toast-path"></span>
  </span>
  <button type="button" class="toast-open" id="toast-open-btn">폴더 열기</button>
  <button type="button" class="toast-dismiss" id="toast-dismiss-btn" aria-label="닫기">✕</button>
</div>

<script>
// ---------- 설정 ----------
// PyWebView에서는 프론트엔드와 API가 같은 로컬 서버(main.py가 띄우는
// uvicorn)에서 서빙되므로 항상 같은 오리진 — 상대경로("")면 충분하다.
// 원본 웹 배포판(GitHub Pages)처럼 원격 프록시를 쓰는 경우를 대비해
// window.DCCON_API_BASE 오버라이드는 남겨둔다.
const API_BASE = window.DCCON_API_BASE || "";
const SAVED_KEY = "dccon_saved_ids";      // localStorage: 다운로드한 package_idx 집합
const LAST_MODE_KEY = "dccon_last_mode";
const THEME_KEY = "dccon_theme";

// ---------- 테마 ----------
function isDarkNow() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr === "dark") return true;
  if (attr === "light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncThemeButton() {
  const btn = document.getElementById("theme-toggle");
  const dark = isDarkNow();
  btn.textContent = dark ? "☀️" : "🌙";
  btn.setAttribute("aria-label", dark ? "밝은 화면으로 전환" : "어두운 화면으로 전환");
}
document.getElementById("theme-toggle").addEventListener("click", () => {
  const next = isDarkNow() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
  syncThemeButton();
});
syncThemeButton();

// ---------- 상태 ----------
let state = { mode: "top", period: "day", page: 1, lastPage: 1, keyword: "", category: "title" };

// ---------- 유틸 ----------
function getSavedIds() {
  try { return new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || "[]")); }
  catch { return new Set(); }
}
function markSaved(id) {
  const ids = getSavedIds();
  ids.add(String(id));
  localStorage.setItem(SAVED_KEY, JSON.stringify([...ids]));
}
function setStatus(text) { document.getElementById("status").textContent = text; }

function proxiedImage(url) {
  // 내 보관함(로컬) 항목은 원격 URL이 아니라 로컬 파일 절대 경로다 —
  // 브라우저(WebView2)는 보안 정책상 file:// 을 <img src>로 직접 열지
  // 못하므로 /api/local_image 프록시를 거친다.
  if (!url.startsWith("http://") && !url.startsWith("https://")) {
    return `${API_BASE}/api/local_image?path=${encodeURIComponent(url)}`;
  }
  // dcimg5.dcinside.com은 Referer가 정확히 https://dccon.dcinside.com/ 인
  // 요청만 허용하고 그 외엔 403을 반환한다(실측 확인). 브라우저의 <img>
  // 태그는 이 페이지 자신의 URL을 Referer로 보내므로 원본 주소를 그대로
  // 쓰면 이미지가 전부 깨진다. 모든 이미지를 /api/image 프록시로 우회
  // 시켜야 한다 — 프록시(서버 간 요청)는 정확한 Referer를 세션에 이미
  // 세팅해두었으므로 통과한다.
  return `${API_BASE}/api/image?url=${encodeURIComponent(url)}`;
}

// ---------- 목록 렌더 ----------
async function loadCurrent() {
  const grid = document.getElementById("grid");
  grid.innerHTML = '<p class="loading-row">불러오는 중…</p>';
  document.getElementById("pager").hidden = true;

  try {
    let items, lastPage = 1, showPager = true;
    if (state.mode === "top") {
      const periodLabel = state.period === "day" ? "일간" : state.period === "week" ? "주간" : "월간";
      setStatus(`${periodLabel} 인기 디시콘을 불러오는 중…`);
      const res = await fetch(`${API_BASE}/api/top5?kind=${state.period}`);
      const data = await res.json();
      items = data.items || [];
      showPager = false;
    } else if (state.mode === "new") {
      setStatus(`NEW ${state.page}페이지 불러오는 중…`);
      const res = await fetch(`${API_BASE}/api/list?kind=new&page=${state.page}`);
      const data = await res.json();
      items = data.items || [];
      lastPage = data.last_page || 1;
    } else if (state.mode === "local") {
      // 페이지 구분 없이 가나다순 전체를 한 번에 보여준다 — 원본 tkinter
      // 앱도 무한 스크롤(가상화)이었지만, 이 그리드는 lazy-loading(loading
      // ="lazy")을 쓰는 <img>라 브라우저가 알아서 화면에 보이는 것만
      // 요청한다(가상 스크롤을 직접 구현할 필요가 없다).
      setStatus("저장 폴더를 확인하는 중…");
      const res = await fetch(`${API_BASE}/api/local_packages`);
      const data = await res.json();
      items = data.items || [];
      showPager = false;
    } else {
      setStatus(`"${state.keyword}" 검색 중…`);
      const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(state.keyword)}&page=${state.page}&category=${state.category}`);
      const data = await res.json();
      items = data.items || [];
      lastPage = data.total_pages || 1;
      setStatus(`검색 결과 ${data.num_text || ""}`);
    }
    state.lastPage = lastPage;
    renderGrid(items);
    if (showPager) {
      document.getElementById("pager").hidden = false;
      document.getElementById("page-label").textContent = `${state.page} / ${state.lastPage}`;
      document.getElementById("prev-page").disabled = state.page <= 1;
      document.getElementById("next-page").disabled = state.page >= state.lastPage;
    }
    if (state.mode !== "search") setStatus(`${items.length}개 표시`);
  } catch (err) {
    setStatus(`불러오기 실패: ${err.message} (프록시 주소 설정을 확인하세요)`);
    document.getElementById("grid").innerHTML = "";
  }
}

function renderGrid(items) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if (!items.length) {
    grid.innerHTML = '<p class="empty-state">결과가 없습니다.</p>';
    return;
  }
  const savedIds = getSavedIds();
  for (const item of items) {
    const card = document.createElement("button");
    // 내 보관함(로컬) 항목은 이미 저장돼 있으니 항상 "저장됨" 표시.
    const isSaved = item.is_local || savedIds.has(String(item.package_idx));
    card.className = "card" + (isSaved ? " saved" : "");
    card.type = "button";
    card.dataset.packageIdx = String(item.package_idx);
    card.innerHTML = `
      <div class="thumb-box">
        <img src="${proxiedImage(item.img)}" alt="" loading="lazy">
        ${item.rank ? `<span class="rank-badge">${escapeHtml(String(item.rank))}</span>` : ""}
      </div>
      <div class="title">${escapeHtml(item.title)}</div>
      <div class="seller">${escapeHtml(item.nick_name)}</div>
      <span class="saved-pill">저장됨</span>
    `;
    card.addEventListener("click", () => openDetail(item));
    card.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      openCtxMenu(e, item.img, `${item.title}.png`, null, item.is_local);
    });
    grid.appendChild(card);
  }
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

// ---------- 다운로드 ----------
const EXT_BY_CONTENT_TYPE = {
  "image/gif": "gif",
  "image/png": "png",
  "image/jpeg": "jpg",
  "image/webp": "webp",
};

async function fetchImageBytes(url) {
  // <a download="icon_1"> 처럼 정적 속성만으로는 서버가 실제로 무슨
  // 포맷을 보냈는지 알 수 없어(클릭 전에는 요청 자체가 안 감) 파일명에
  // 확장자를 붙일 수 없었다 — 특히 GIF가 확장자 없이 저장되면 일부
  // OS/뷰어가 정지 이미지로 오인해 애니메이션이 재생되지 않는다.
  // fetch로 직접 받아 Content-Type을 확인한 뒤에 파일명을 정한다.
  const res = await fetch(`${API_BASE}/api/image?url=${encodeURIComponent(url)}`);
  if (!res.ok) throw new Error(`이미지를 받지 못함 (HTTP ${res.status})`);
  const contentType = (res.headers.get("Content-Type") || "").split(";")[0].trim();
  const ext = EXT_BY_CONTENT_TYPE[contentType] || "png";
  const bytes = new Uint8Array(await res.arrayBuffer());
  return { bytes, ext };
}

function saveBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function downloadSingleImage(url, baseName, linkEl) {
  const original = linkEl.textContent;
  linkEl.textContent = "받는 중…";
  try {
    const { bytes, ext } = await fetchImageBytes(url);
    saveBlob(new Blob([bytes]), `${baseName}.${ext}`);
  } catch (err) {
    alert(`다운로드 실패: ${err.message}`);
  } finally {
    linkEl.textContent = original;
  }
}

// ---------- ZIP (store 방식 — 무압축, 외부 라이브러리 없이 직접 작성) ----------
// PNG/JPG/GIF는 이미 압축된 포맷이라 deflate로 다시 압축해도 거의
// 줄어들지 않는다 — store(무압축) 방식이면 압축 알고리즘 구현 없이도
// 표준 ZIP 리더(탐색기, 반디집 등)가 그대로 열 수 있어 이 쪽을 택했다.
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  }
  return (crc ^ 0xffffffff) >>> 0;
}
function dosDateTime(date) {
  const time = ((date.getHours() & 0x1f) << 11) | ((date.getMinutes() & 0x3f) << 5) | ((date.getSeconds() >> 1) & 0x1f);
  const day = (((date.getFullYear() - 1980) & 0x7f) << 9) | (((date.getMonth() + 1) & 0xf) << 5) | (date.getDate() & 0x1f);
  return { time, day };
}
function buildZip(files) {
  // files: [{name: string, data: Uint8Array}]
  const encoder = new TextEncoder();
  const { time, day } = dosDateTime(new Date());
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = encoder.encode(file.name);
    const crc = crc32(file.data);
    const size = file.data.length;

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0, true);
    local.setUint16(8, 0, true); // store = 압축 없음
    local.setUint16(10, time, true);
    local.setUint16(12, day, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, size, true);
    local.setUint32(22, size, true);
    local.setUint16(26, nameBytes.length, true);
    local.setUint16(28, 0, true);
    localParts.push(new Uint8Array(local.buffer), nameBytes, file.data);

    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    central.setUint16(6, 20, true);
    central.setUint16(8, 0, true);
    central.setUint16(10, 0, true);
    central.setUint16(12, time, true);
    central.setUint16(14, day, true);
    central.setUint32(16, crc, true);
    central.setUint32(20, size, true);
    central.setUint32(24, size, true);
    central.setUint16(28, nameBytes.length, true);
    central.setUint16(30, 0, true);
    central.setUint16(32, 0, true);
    central.setUint16(34, 0, true);
    central.setUint16(36, 0, true);
    central.setUint32(38, 0, true);
    central.setUint32(42, offset, true);
    centralParts.push(new Uint8Array(central.buffer), nameBytes);

    offset += local.buffer.byteLength + nameBytes.length + size;
  }

  const centralStart = offset;
  let centralSize = 0;
  for (const p of centralParts) centralSize += p.length;

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(4, 0, true);
  end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, centralStart, true);
  end.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, new Uint8Array(end.buffer)], { type: "application/zip" });
}

// ---------- 상세 모달 ----------
async function openDetail(item) {
  const backdrop = document.getElementById("modal-backdrop");
  const body = document.getElementById("modal-body");
  document.getElementById("modal-title").textContent = item.title;
  document.getElementById("modal-meta").textContent = "불러오는 중…";
  body.innerHTML = "";
  document.getElementById("zip-status").textContent = "";
  backdrop.hidden = false;

  try {
    // 내 보관함(로컬) 항목은 이미 다운로드되어 있으므로 서버 재조회 없이
    // 폴더 안 파일을 그대로 나열한다(원본 tkinter 앱의 _load_local과 동일).
    let detail;
    if (item.is_local) {
      const res = await fetch(`${API_BASE}/api/local_package_files?folder=${encodeURIComponent(item.folder_path)}`);
      const data = await res.json();
      detail = { title: item.title, seller: "", tags: "", urls: data.files || [] };
    } else {
      const res = await fetch(`${API_BASE}/api/detail?id=${item.package_idx}`);
      detail = await res.json();
    }
    document.getElementById("modal-meta").textContent =
      [detail.seller, detail.tags && `태그: ${detail.tags}`].filter(Boolean).join(" · ");

    body.innerHTML = "";
    detail.urls.forEach((url, i) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      const baseName = i === 0 ? "main_img" : `icon_${i}`;
      // 이미 저장된 로컬 항목은 "저장" 링크 자체가 의미 없어(원본과 동일
      // 정책) 데스크톱 환경에서는 클립보드 복사만 우클릭 메뉴로 제공한다.
      cell.innerHTML = item.is_local
        ? `<img src="${proxiedImage(url)}" alt="" loading="lazy">`
        : `
        <img src="${proxiedImage(url)}" alt="" loading="lazy">
        <a class="dl" href="#" role="button">저장</a>
      `;
      if (!item.is_local) {
        const link = cell.querySelector("a.dl");
        link.addEventListener("click", (e) => {
          e.preventDefault();
          downloadSingleImage(url, baseName, link);
        });
      }
      cell.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        openCtxMenu(e, url, `${baseName}`, { item, baseName, url }, item.is_local);
      });
      body.appendChild(cell);
    });

    const downloadAllBtn = document.getElementById("modal-download-all");
    if (item.is_local) {
      // 이미 다 저장된 패키지 — 전체 다운로드 버튼 자체를 숨긴다.
      downloadAllBtn.hidden = true;
      return;
    }
    downloadAllBtn.hidden = false;
    // 데스크톱(PyWebView) 환경에서는 zip 압축 없이 지정된 저장 폴더에
    // 개별 파일로 바로 저장한다(main.py의 download_images, 원본 tkinter
    // 앱과 동일한 방식). 순수 웹 배포판(브라우저)에서는 서버 파일 접근이
    // 없으므로 기존 클라이언트 사이드 zip 방식을 그대로 쓴다.
    downloadAllBtn.onclick = hasDesktopBridge()
      ? () => downloadAllToFolder(item, detail)
      : () => downloadAllAsZip(item, detail);
    downloadAllBtn.textContent = hasDesktopBridge() ? "전체 다운로드" : "전체 다운로드 (zip)";
  } catch (err) {
    document.getElementById("modal-meta").textContent = `불러오기 실패: ${err.message}`;
  }
}

async function downloadAllToFolder(item, detail) {
  const btn = document.getElementById("modal-download-all");
  const status = document.getElementById("zip-status");
  if (!downloadDir) { status.textContent = "저장 폴더가 설정되지 않았습니다"; return; }
  btn.disabled = true;
  status.textContent = "받는 중…";
  try {
    const result = await window.pywebview.api.download_images(item.title, detail.urls, downloadDir);
    if (result.ok) {
      status.textContent = result.failed.length
        ? `완료 (실패 ${result.failed.length}개)`
        : "다운로드 완료";
      markSaved(item.package_idx);
      refreshSavedBadge(item.package_idx);
      showToast(`${item.title} · ${result.saved.length}개 저장 완료`, result.dir);
    } else {
      status.textContent = `실패: ${result.error}`;
    }
  } catch (err) {
    status.textContent = `실패: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

async function downloadAllAsZip(item, detail) {
  const btn = document.getElementById("modal-download-all");
  const status = document.getElementById("zip-status");
  btn.disabled = true;
  try {
    const files = [];
    for (let i = 0; i < detail.urls.length; i++) {
      status.textContent = `${i + 1}/${detail.urls.length} 받는 중…`;
      const baseName = i === 0 ? "main_img" : `icon_${i}`;
      const { bytes, ext } = await fetchImageBytes(detail.urls[i]);
      files.push({ name: `${baseName}.${ext}`, data: bytes });
    }
    status.textContent = "압축하는 중…";
    const zipBlob = buildZip(files);
    const zipName = `${sanitizeFilename(item.title) || "dccon"}.zip`;
    saveBlob(zipBlob, zipName);
    status.textContent = "다운로드 완료";
    markSaved(item.package_idx);
    refreshSavedBadge(item.package_idx);
  } catch (err) {
    status.textContent = `실패: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

function sanitizeFilename(name) {
  // Windows 등에서 파일명에 못 쓰는 문자만 최소한으로 치환.
  return String(name || "").replace(/[\\/:*?"<>|]/g, "_").trim();
}

function refreshSavedBadge(packageIdx) {
  // 방금 다운로드한 항목이 지금 화면에 카드로 떠 있으면(같은 목록에서
  // 바로 다운로드한 경우) 화면을 다시 불러오지 않고도 그 카드에만
  // "저장됨" 표시를 즉시 붙인다. saved-pill은 항상 DOM에 있고
  // .card.saved 일 때만 CSS로 보이므로 클래스 토글만으로 충분하다.
  const card = document.querySelector(`.card[data-package-idx="${CSS.escape(String(packageIdx))}"]`);
  if (card) card.classList.add("saved");
}

// ---------- 데스크톱 전용: PyWebView 브릿지 ----------
// window.pywebview.api는 main.py의 DesktopBridge 인스턴스. 창이 로드된
// 직후에 pywebviewready 이벤트가 발생하기 전까지는 아직 준비되지 않을 수
// 있어(문서 로드와 네이티브 브릿지 주입 타이밍이 다름), 항상 존재 여부를
// 확인하고 없으면 조용히 건너뛴다 — 이렇게 하면 이 index.html을 순수
// 브라우저(GitHub Pages 웹 배포판)에서 열어도 에러 없이 동작한다.
function hasDesktopBridge() {
  return !!(window.pywebview && window.pywebview.api);
}

let downloadDir = "";

async function initFolderBar() {
  if (!hasDesktopBridge()) return;
  const bar = document.getElementById("folder-bar");
  const config = await window.pywebview.api.get_config();
  downloadDir = config.download_dir || await window.pywebview.api.get_default_download_dir();
  document.getElementById("folder-path").textContent = downloadDir;
  bar.hidden = false;
  // "내 보관함" 탭은 로컬 파일시스템 접근이 필요해 데스크톱 환경에서만 노출.
  document.getElementById("tab-local").hidden = false;
}

document.getElementById("folder-open-btn")?.addEventListener("click", () => {
  if (downloadDir) window.pywebview.api.open_folder(downloadDir);
});
document.getElementById("folder-change-btn")?.addEventListener("click", async () => {
  const picked = await window.pywebview.api.pick_download_dir();
  if (!picked) return;
  downloadDir = picked;
  document.getElementById("folder-path").textContent = downloadDir;
  await window.pywebview.api.save_config({ download_dir: downloadDir });
});

// ---------- 데스크톱 전용: 다운로드 완료 토스트 ----------
let toastHideTimer = null;
function showToast(title, path) {
  const toast = document.getElementById("toast");
  document.getElementById("toast-title").textContent = title;
  document.getElementById("toast-path").textContent = path || "";
  toast.classList.add("visible");
  clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(() => toast.classList.remove("visible"), 6000);
}
document.getElementById("toast-open-btn")?.addEventListener("click", () => {
  if (downloadDir) window.pywebview.api.open_folder(downloadDir);
});
document.getElementById("toast-dismiss-btn")?.addEventListener("click", () => {
  document.getElementById("toast").classList.remove("visible");
});

// ---------- 데스크톱 전용: 우클릭 컨텍스트 메뉴 ----------
// ctxState: 메뉴가 열려있는 동안 대상 이미지 정보를 들고 있다가, 메뉴
// 클릭 시 그 정보로 다운로드/복사를 수행한다.
let ctxState = null;

function openCtxMenu(e, imageUrl, displayName, extra, isLocal) {
  if (!hasDesktopBridge()) return; // 웹(브라우저) 배포판에서는 메뉴를 열지 않음 — 다운로드/복사가 서버 파일 저장을 전제로 하기 때문
  ctxState = { imageUrl, displayName, extra, isLocal: !!isLocal };
  const menu = document.getElementById("ctx-menu");
  document.getElementById("ctx-target").textContent = displayName;
  // 이미 저장된(내 보관함) 이미지는 "다운로드" 메뉴가 의미 없다 —
  // 클립보드 복사/주소 복사만 제공한다(원본 tkinter 앱과 동일 정책).
  document.getElementById("ctx-download").hidden = !!isLocal;
  menu.hidden = false;
  // 메뉴가 창 밖으로 나가지 않도록 클램프.
  const menuW = 200, menuH = 160;
  const x = Math.min(e.clientX, window.innerWidth - menuW);
  const y = Math.min(e.clientY, window.innerHeight - menuH);
  menu.style.left = `${Math.max(0, x)}px`;
  menu.style.top = `${Math.max(0, y)}px`;
}
function closeCtxMenu() {
  document.getElementById("ctx-menu").hidden = true;
  ctxState = null;
}
document.addEventListener("click", (e) => {
  // 메뉴 자신을 클릭한 게 아니면 닫는다 (각 항목 클릭 핸들러가 먼저
  // 동작한 뒤 이 전역 리스너가 닫으므로 순서 문제 없음).
  if (!e.target.closest("#ctx-menu")) closeCtxMenu();
});
document.addEventListener("contextmenu", (e) => {
  // 메뉴/카드/셀이 아닌 곳(빈 배경 등)에서의 우클릭은 브라우저 기본
  // 메뉴 대신 그냥 무시 — 데스크톱 앱에서 우클릭 시 브라우저 메뉴가
  // 뜨는 건 어색하다.
  if (!e.target.closest(".card") && !e.target.closest(".cell")) e.preventDefault();
});

document.getElementById("ctx-download")?.addEventListener("click", async () => {
  if (!ctxState || !downloadDir) return;
  const { imageUrl, displayName } = ctxState;
  closeCtxMenu();
  try {
    const result = await window.pywebview.api.download_images(displayName, [imageUrl], downloadDir);
    if (result.ok) showToast(`${displayName} 저장 완료`, result.dir);
    else showToast(`저장 실패: ${result.error}`, "");
  } catch (err) {
    showToast(`저장 실패: ${err.message}`, "");
  }
});

document.getElementById("ctx-copy")?.addEventListener("click", async () => {
  if (!ctxState) return;
  const { imageUrl, displayName } = ctxState;
  closeCtxMenu();
  try {
    const res = await fetch(proxiedImage(imageUrl));
    const contentType = (res.headers.get("Content-Type") || "").split(";")[0].trim();
    const buf = await res.arrayBuffer();
    const b64 = arrayBufferToBase64(buf);
    // GIF는 CF_DIB로 복사하면 애니메이션이 소실되므로(원본 tkinter 앱에서
    // 실측 확인된 제약, desktop.py 주석 참고) 파일 자체를 CF_HDROP으로
    // 올리는 copy_file_to_clipboard를 쓴다. 그 외 정지 이미지는 표준
    // 이미지 클립보드 포맷(CF_DIB)이 더 널리 호환되므로 그쪽을 쓴다.
    let result;
    if (contentType === "image/gif") {
      const ext = "gif";
      result = await window.pywebview.api.copy_file_to_clipboard(b64, `${displayName}.${ext}`);
    } else {
      result = await window.pywebview.api.copy_image_to_clipboard(b64);
    }
    if (result.ok) showToast("클립보드에 복사했습니다", "");
    else showToast(`복사 실패: ${result.error}`, "");
  } catch (err) {
    showToast(`복사 실패: ${err.message}`, "");
  }
});

document.getElementById("ctx-copy-link")?.addEventListener("click", async () => {
  if (!ctxState) return;
  const { imageUrl } = ctxState;
  closeCtxMenu();
  try {
    await navigator.clipboard.writeText(imageUrl);
    showToast("이미지 주소를 복사했습니다", "");
  } catch (err) {
    showToast(`복사 실패: ${err.message}`, "");
  }
});

function arrayBufferToBase64(buf) {
  let binary = "";
  const bytes = new Uint8Array(buf);
  const chunkSize = 0x8000; // 큰 GIF(수 MB)를 한 번에 String.fromCharCode에 넣으면 인수 개수 제한에 걸릴 수 있어 청크로 나눈다
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// window.pywebview.api는 DOMContentLoaded/onload보다 늦게 준비될 수 있어
// (pywebview 공식 가이드) 전용 이벤트를 기다린다. 순수 브라우저(웹
// 배포판)에서는 이 이벤트가 아예 발생하지 않으므로, hasDesktopBridge()가
// 이미 true인 경우(이벤트를 놓친 뒤 뒤늦게 스크립트가 실행된 경우 등)에도
// 대비해 즉시 한 번 더 시도한다.
window.addEventListener("pywebviewready", initFolderBar);
if (hasDesktopBridge()) initFolderBar();

document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-backdrop").hidden = true;
});
document.getElementById("modal-backdrop").addEventListener("click", (e) => {
  if (e.target.id === "modal-backdrop") e.target.hidden = true;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("modal-backdrop").hidden = true;
});

// ---------- 탭 / 검색 / 페이지네이션 ----------
document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.mode = btn.dataset.mode;
    state.period = btn.dataset.period || state.period;
    state.page = 1;
    localStorage.setItem(LAST_MODE_KEY, JSON.stringify({ mode: state.mode, period: state.period }));
    loadCurrent();
  });
});

document.getElementById("search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const kw = document.getElementById("search-input").value.trim();
  if (!kw) return;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-pressed", "false"));
  state.mode = "search";
  state.keyword = kw;
  state.category = document.getElementById("search-category").value;
  state.page = 1;
  loadCurrent();
});

document.getElementById("prev-page").addEventListener("click", () => {
  if (state.page > 1) { state.page--; loadCurrent(); }
});
document.getElementById("next-page").addEventListener("click", () => {
  if (state.page < state.lastPage) { state.page++; loadCurrent(); }
});

// ---------- 초기 로드 ----------
loadCurrent();
</script>
</body>
</html>
